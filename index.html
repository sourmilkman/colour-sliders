<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#100f16">
  <meta name="description" content="A tactile colour-matching game. Tune the sliders, trust your eye, and chase a perfect match.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Chroma — Colour Sliders</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Chroma colour game">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>chroma</span>
      </div>
      <div class="top-actions">
        <button class="icon-button install-button" id="installButton" type="button" hidden aria-label="Install app" title="Install app">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </button>
        <button class="icon-button" id="soundButton" type="button" aria-label="Turn sound off" title="Sound">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5Zm11-1a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5Zm11 0 5 5m0-5-5 5"/></svg>
        </button>
      </div>
    </header>

    <section class="score-strip" aria-label="Game statistics">
      <div><span>ROUND</span><strong><b id="roundCount">1</b> / 10</strong></div>
      <div><span>SCORE</span><strong id="scoreCount">0</strong></div>
      <div><span>BEST</span><strong id="bestCount">—</strong></div>
    </section>

    <section class="game-card">
      <div class="prompt">
        <p>Match this colour</p>
        <div class="streak" id="streakBadge" hidden><span aria-hidden="true">◆</span> <b id="streakCount">2</b> streak</div>
      </div>

      <div class="colour-stage">
        <div class="target-wrap">
          <div class="colour-orb target-orb" id="targetOrb" aria-label="Target colour"></div>
          <span>TARGET</span>
        </div>
        <div class="match-meter" aria-hidden="true">
          <span id="liveMatch">—</span>
          <i></i>
        </div>
        <div class="target-wrap">
          <div class="colour-orb guess-orb" id="guessOrb" aria-label="Your colour"></div>
          <span>YOURS</span>
        </div>
      </div>

      <div class="sliders" aria-label="Colour controls">
        <label class="slider-row red">
          <span class="channel"><i>R</i><b>Red</b></span>
          <input id="redSlider" type="range" min="0" max="255" value="128" aria-label="Red value">
          <output id="redValue" for="redSlider">128</output>
        </label>
        <label class="slider-row green">
          <span class="channel"><i>G</i><b>Green</b></span>
          <input id="greenSlider" type="range" min="0" max="255" value="128" aria-label="Green value">
          <output id="greenValue" for="greenSlider">128</output>
        </label>
        <label class="slider-row blue">
          <span class="channel"><i>B</i><b>Blue</b></span>
          <input id="blueSlider" type="range" min="0" max="255" value="128" aria-label="Blue value">
          <output id="blueValue" for="blueSlider">128</output>
        </label>
      </div>

      <button class="check-button" id="checkButton" type="button">
        <span>Lock in colour</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </section>

    <p class="hint"><span aria-hidden="true">✦</span> Get within 90% to build a streak</p>
  </main>

  <dialog class="result-dialog" id="resultDialog">
    <div class="result-glow" id="resultGlow"></div>
    <div class="result-content">
      <span class="eyebrow" id="resultEyebrow">ROUND COMPLETE</span>
      <strong class="result-score"><b id="resultScore">94</b><small>%</small></strong>
      <h2 id="resultTitle">Beautiful match</h2>
      <p id="resultCopy">That was seriously close. Your eye for colour is warming up.</p>
      <div class="comparison">
        <div><i id="resultTarget"></i><span>Target</span><code id="targetHex">#000000</code></div>
        <div><i id="resultGuess"></i><span>Yours</span><code id="guessHex">#000000</code></div>
      </div>
      <button class="check-button" id="nextButton" type="button"><span>Next round</span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
